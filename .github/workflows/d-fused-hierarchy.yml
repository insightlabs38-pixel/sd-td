name: D fused exact hierarchy architecture
on:
  push:
    branches: ['research/d-breakthrough-20261101-fused-hierarchy']
    paths:
      - 'research/d-breakthrough/**'
      - '.github/workflows/d-fused-hierarchy.yml'
  workflow_dispatch:
jobs:
  fused-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public independent oracle
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Compile baseline and two native fused hierarchy configurations
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d-base track-d/d_traverse.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_FCH_DEG=3 -DSD_FCH_BUDGET=0 -o /tmp/d-fch3 research/d-breakthrough/fused_hierarchy.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_FCH_DEG=4 -DSD_FCH_BUDGET=2 -o /tmp/d-fch4 research/d-breakthrough/fused_hierarchy.cpp
          wc -c track-d/d_traverse.cpp research/d-breakthrough/fused_hierarchy.cpp
      - name: Exact adversarial Dijkstra differential (both configurations)
        run: |
          set -euo pipefail
          for variant in fch3 fch4; do
            SD_TEST_BINARY=/tmp/d-$variant python tests/test_d.py
          done
      - name: Complete 2000-query seeded graph benchmark and hash crosschecks
        run: python research/d-breakthrough/bench_fch.py
      - name: Report full graph fused elimination population
        run: |
          set -euo pipefail
          mkdir -p /tmp/fch-out
          SD_THREADS=4 SD_DATA=/tmp/d-bt-data-1 SD_OUT=/tmp/fch-out /tmp/d-fch3
          echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/fch-out/distances.txt' | sha256sum -c
      - name: ASan and UBSan differential
        run: |
          g++ -O1 -g -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/d-fch-san research/d-breakthrough/fused_hierarchy.cpp
          SD_TEST_BINARY=/tmp/d-fch-san python tests/test_d.py
      - name: Preserve full-seed timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-fused-terminal-hierarchy
          path: /tmp/d-fch-results.json
          if-no-files-found: ignore
