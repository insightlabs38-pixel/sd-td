name: D prefetch locality matched tournament
on:
  push:
    paths:
      - .github/workflows/d-prefetch-locality.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain public official generator
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Build six locality variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('track-d/d_traverse.cpp').read_text()
          graph='__builtin_prefetch(&g.slot[size_t(ahead) * 4], 0, 1);'
          dist='__builtin_prefetch(dist.at(ahead), 0, 1);'
          assert src.count(graph)==1 and src.count(dist)==1
          variants={'11':(1,1),'00':(0,0),'22':(2,2),'33':(3,3),'31':(3,1),'13':(1,3)}
          for name,(g,d) in variants.items():
              text=src.replace(graph,graph.replace(', 0, 1);',f', 0, {g});'))
              text=text.replace(dist,dist.replace(', 0, 1);',f', 0, {d});'))
              Path(f'/tmp/d-h{name}.cpp').write_text(text)
          PY
          for h in 11 00 22 33 31 13; do
            g++ -O3 -std=c++17 -pthread -flto -static -s -o "/tmp/d-h$h" "/tmp/d-h$h.cpp"
          done
          for h in 00 22 33 31 13; do
            SD_TEST_BINARY="/tmp/d-h$h" python tests/test_d.py
          done
      - name: Two-seed interleaved exact full-process tournament
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys,random,hashlib,statistics,subprocess,time,pathlib
          variants=['11','00','22','33','31','13']
          workers=(4,6,12)
          rounds=13
          expected={}
          data={}
          outs={h:pathlib.Path('/tmp/out-'+h) for h in variants}
          for out in outs.values():out.mkdir(exist_ok=True)
          for seed in (1,7):
              p=pathlib.Path(f'/tmp/seed-{seed}')
              p.mkdir(exist_ok=True)
              subprocess.run([sys.executable,'/tmp/official/generators/d_traverse.py','--seed',str(seed),'--scale','full','--out',str(p)],check=True,stdout=subprocess.DEVNULL)
              data[seed]=p
              with (p/'graph.txt').open('rb') as f:
                  while f.read(1<<20):pass
              env=os.environ.copy()
              env.update(SD_DATA=str(p),SD_OUT=str(outs['11']),SD_THREADS='6')
              subprocess.run(['/tmp/d-h11'],env=env,check=True)
              expected[seed]=hashlib.sha256((outs['11']/'distances.txt').read_bytes()).hexdigest()
              if seed==1:
                  assert expected[seed]=='a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e'
              print('SEED_HASH',seed,expected[seed],flush=True)
          for seed in (1,7):
              for t in workers:
                  times={h:[] for h in variants}
                  wins={h:0 for h in variants if h!='11'}
                  rng=random.Random(seed*100+t)
                  for h in variants:
                      env=os.environ.copy()
                      env.update(SD_DATA=str(data[seed]),SD_OUT=str(outs[h]),SD_THREADS=str(t))
                      subprocess.run(['/tmp/d-h'+h],env=env,check=True,stdout=subprocess.DEVNULL)
                  for i in range(rounds):
                      order=variants.copy()
                      rng.shuffle(order)
                      one={}
                      for h in order:
                          env=os.environ.copy()
                          env.update(SD_DATA=str(data[seed]),SD_OUT=str(outs[h]),SD_THREADS=str(t))
                          st=time.perf_counter()
                          subprocess.run(['/tmp/d-h'+h],env=env,check=True,stdout=subprocess.DEVNULL)
                          one[h]=time.perf_counter()-st
                          got=hashlib.sha256((outs[h]/'distances.txt').read_bytes()).hexdigest()
                          assert got==expected[seed],(seed,t,h,i,got)
                          times[h].append(one[h])
                      for h in wins:wins[h]+=one[h]<one['11']
                  base=statistics.median(times['11'])
                  for h in variants:
                      med=statistics.median(times[h])
                      print(f'RESULT seed={seed} workers={t} hint={h} median_s={med:.6f} baseline_s={base:.6f} change_pct={(med/base-1)*100:+.3f} wins={wins.get(h,"base")}/{rounds}',flush=True)
          print('PASS exact full-seed executions',2*len(workers)*rounds*len(variants),flush=True)
          PY
