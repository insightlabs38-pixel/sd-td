name: D full-system phase profile
on:
  push:
    branches: ['research/d-breakthrough-20261101-phase-profile']
    paths:
      - 'research/d-breakthrough/**'
      - '.github/workflows/d-phase-profile.yml'
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate published full-scale seed
        run: |
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          mkdir -p /tmp/d-data /tmp/d-output
          python /tmp/official/generators/d_traverse.py --seed 1 --scale full --out /tmp/d-data
      - name: Compile baseline and instrumented native solver
        run: |
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d-profile research/d-breakthrough/profiled_baseline.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d-base track-d/d_traverse.cpp
      - name: Exact official hash plus seven phase profiles at each worker count
        run: |
          set -euo pipefail
          for workers in 4 12; do
            for rep in 1 2 3 4 5 6 7; do
              echo "D_RUN workers=$workers repeat=$rep"
              SD_DATA=/tmp/d-data SD_OUT=/tmp/d-output SD_THREADS=$workers /usr/bin/time -f 'D_RESOURCE rss_kib=%M elapsed_s=%e' /tmp/d-profile
              echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/d-output/distances.txt' | sha256sum -c
            done
          done
