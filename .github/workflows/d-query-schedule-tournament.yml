name: D query schedule matched tournament
on:
  push:
    branches:
      - d/query-tail-scheduling-20261101
    paths:
      - .github/workflows/d-query-schedule-tournament.yml
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Obtain official generator
        run: |
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          git -C /tmp/official rev-parse HEAD
      - name: Build five scheduling variants
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4; do
            g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_SCHED=$i -o /tmp/d-$i track-d/d_traverse.cpp
          done
      - name: Differential adversarial cases
        run: SD_TEST_BINARY=/tmp/d-1 python3 tests/test_d.py
      - name: Official full-seed matched tournament
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/official/generators/d_traverse.py --seed 1 --scale full --out /tmp/d-seed-1
          python3 /tmp/official/generators/d_traverse.py --seed 7 --scale full --out /tmp/d-seed-7
          mkdir -p /tmp/d-results
          python3 - <<'PY'
          import hashlib, json, os, pathlib, random, statistics, subprocess, time
          variants = range(5)
          for seed in (1, 7):
              data = pathlib.Path(f'/tmp/d-seed-{seed}')
              for path in ('graph.txt', 'queries.txt'):
                  with open(data / path, 'rb') as f:
                      while f.read(1 << 20):
                          pass
              for workers in (4, 6, 12):
                  samples = {v: [] for v in variants}
                  hashes = {v: set() for v in variants}
                  for round_id in range(13):
                      order = list(variants)
                      random.Random(seed * 100000 + workers * 1000 + round_id).shuffle(order)
                      for variant in order:
                          env = dict(os.environ, SD_DATA=str(data),
                                     SD_OUT='/tmp/d-results', SD_THREADS=str(workers))
                          start = time.perf_counter()
                          subprocess.run([f'/tmp/d-{variant}'], env=env, check=True,
                                         stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                          samples[variant].append(time.perf_counter() - start)
                          hashes[variant].add(hashlib.sha256(
                              pathlib.Path('/tmp/d-results/distances.txt').read_bytes()
                          ).hexdigest())
                  assert all(len(hashes[v]) == 1 for v in variants), hashes
                  assert len({next(iter(hashes[v])) for v in variants}) == 1, hashes
                  if seed == 1:
                      assert next(iter(hashes[0])) == 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e'
                  base = statistics.median(samples[0])
                  report = {
                      'seed': seed, 'workers': workers,
                      'baseline_s': round(base, 6),
                      'variants': [
                          {
                              'id': v,
                              'median_s': round(statistics.median(samples[v]), 6),
                              'delta_pct': round(100 * (statistics.median(samples[v]) / base - 1), 3),
                              'wins': sum(a < b for a, b in zip(samples[v], samples[0])),
                              'rounds': len(samples[v]),
                          } for v in variants if v != 0
                      ],
                      'output_sha256': next(iter(hashes[0])),
                  }
                  print('RESULT', json.dumps(report, sort_keys=True), flush=True)
          PY