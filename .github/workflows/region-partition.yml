name: Track D region-aligned reverse construction
on:
  push:
    paths:
      - .github/workflows/region-partition.yml
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact alternatives
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/region-equal track-d/d_traverse.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_REGION_CUTS -o /tmp/region-region track-d/d_traverse.cpp
      - name: Differential and official full-seed gates
        shell: bash
        run: |
          set -euo pipefail
          for variant in equal region; do
            SD_TEST_BINARY="/tmp/region-$variant" python tests/test_d.py
          done
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          mkdir -p /tmp/full-data
          python /tmp/official/generators/d_traverse.py --seed 1 --scale full --out /tmp/full-data
          echo 'fe6471f2712d10b23c2ec58a4cbc7db1ea3e742daf6b6db62829e74d6c4a26c7  /tmp/full-data/graph.txt' | sha256sum -c
          echo '160f1ef48378dcb567a8d9ddd2676ee777b044a5ede3ad4c7b42e812aa4b3a6f  /tmp/full-data/queries.txt' | sha256sum -c
      - name: Paired full-run tournament and peak RSS
        shell: bash
        run: |
          set -euo pipefail
          python tests/region_partition_tournament.py
          for variant in equal region; do
            mkdir -p "/tmp/region-rss-$variant"
            SD_DATA=/tmp/full-data SD_OUT="/tmp/region-rss-$variant" SD_THREADS=12 /usr/bin/time -v "/tmp/region-$variant"
            echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/region-rss-'$variant'/distances.txt' | sha256sum -c
          done
