name: D exact growth-batch micro-tournament
on:
  push:
    branches: [d/grow-mini-20261101]
    paths: [.github/workflows/d-grow-mini.yml]
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and compare exact candidates
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          for b in 2 4 8 16; do
            sed "s/static constexpr u32 BATCH = 16;/static constexpr u32 BATCH = $b;/" track-d/d_traverse.cpp > "/tmp/d-b$b.cpp"
            grep -q "static constexpr u32 BATCH = $b;" "/tmp/d-b$b.cpp"
            g++ -O3 -std=c++17 -pthread -flto -static -s -o "/tmp/d-b$b" "/tmp/d-b$b.cpp"
          done
          for b in 2 4 8; do
            SD_TEST_BINARY="/tmp/d-b$b" python tests/test_d.py
          done
          python3 - <<'PY'
          import hashlib, os, pathlib, random, statistics, subprocess, time
          B=(2,4,8,16); workers=(4,6,12); rounds=13
          data={}
          for seed in (1,7):
              path=pathlib.Path(f"/tmp/seed-{seed}")
              path.mkdir()
              subprocess.run(["python3","/tmp/official/generators/d_traverse.py","--seed",str(seed),"--scale","full","--out",str(path)],check=True)
              data[seed]=path
          outs={b:pathlib.Path(f"/tmp/out-b{b}") for b in B}
          for p in outs.values(): p.mkdir()
          expected={1:"a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e"}
          # Warm all graph and query pages before timing, then keep warm.
          for p in data.values():
              for f in ("graph.txt","queries.txt"):
                  with (p/f).open("rb") as fd:
                      while fd.read(1<<20): pass
          for seed in (1,7):
              env=os.environ.copy();env.update(SD_DATA=str(data[seed]),SD_OUT=str(outs[16]),SD_THREADS="6")
              subprocess.run(["/tmp/d-b16"],env=env,check=True)
              h=hashlib.sha256((outs[16]/"distances.txt").read_bytes()).hexdigest()
              if seed in expected: assert h==expected[seed],(seed,h)
              expected[seed]=h
          print("OFFICIAL_FULL_OUTPUT_HASHES",expected,flush=True)
          rng=random.Random(20261101)
          for seed in (1,7):
              for t in workers:
                  times={b:[] for b in B};wins={b:0 for b in B if b!=16}
                  for round in range(rounds):
                      order=list(B);rng.shuffle(order)
                      one={}
                      for b in order:
                          env=os.environ.copy()
                          env.update(SD_DATA=str(data[seed]),SD_OUT=str(outs[b]),SD_THREADS=str(t))
                          begin=time.perf_counter()
                          subprocess.run([f"/tmp/d-b{b}"],env=env,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                          elapsed=time.perf_counter()-begin
                          h=hashlib.sha256((outs[b]/"distances.txt").read_bytes()).hexdigest()
                          assert h==expected[seed],(seed,t,b,round,h,expected[seed])
                          times[b].append(elapsed);one[b]=elapsed
                      for b in wins:wins[b]+=one[b]<one[16]
                  base=statistics.median(times[16])
                  for b in B:
                      med=statistics.median(times[b])
                      print(f"RESULT seed={seed} workers={t} batch={b} median_s={med:.6f} baseline_s={base:.6f} change_pct={(med/base-1)*100:+.3f} wins={wins.get(b,'baseline')}/{rounds}",flush=True)
          print("PASS all exact full-seed executions",2*len(workers)*rounds*len(B),flush=True)
          PY
