name: D input lifetime end-to-end memory and time
on:
  push:
    branches: ['research/d-breakthrough-20261101-input-lifetime']
    paths: ['research/d-breakthrough/**', '.github/workflows/d-input-lifetime.yml']
  workflow_dispatch:
jobs:
  lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain official frozen generator
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Compile original and input-release native solvers
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d-base track-d/d_traverse.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d-unmap research/d-breakthrough/input_lifetime.cpp
          wc -l -c track-d/d_traverse.cpp research/d-breakthrough/input_lifetime.cpp
      - name: Independent exact random and adversarial cases
        run: SD_TEST_BINARY=/tmp/d-unmap python tests/test_d.py
      - name: Full-seed matched complete time for four and twelve workers
        run: python research/d-breakthrough/bench_input_lifetime.py
      - name: Repeat actual max RSS observation with warmed source files
        run: |
          set -euo pipefail
          for t in 4 12; do
            for run in 1 2 3 4 5; do
              for mode in base unmap; do
                echo "D_RSS $mode threads=$t run=$run"
                SD_THREADS=$t SD_DATA=/tmp/d-bt-data-1 SD_OUT=/tmp/d-bt-out /usr/bin/time -f 'D_MAX_RSS_KB %M D_WALL_S %e' /tmp/d-$mode 2>&1
                echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/d-bt-out/distances.txt' | sha256sum -c
              done
            done
          done
      - name: ASan UBSan exactness
        run: |
          g++ -O1 -g -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/d-unmap-san research/d-breakthrough/input_lifetime.cpp
          SD_TEST_BINARY=/tmp/d-unmap-san python tests/test_d.py
      - name: Save raw paired wall receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-input-lifetime-full-benchmark
          path: /tmp/d-input-lifetime-results.json
          if-no-files-found: ignore
