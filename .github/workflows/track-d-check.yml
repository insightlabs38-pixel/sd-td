name: D opus-last candidates paired benchmark
on:
  push:
    paths:
      - .github/workflows/track-d-check.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build four sources with the pinned gcc:15 image and the Dockerfile flags
        shell: bash
        run: |
          set -euo pipefail
          sha1sum bench/*.cpp
          git hash-object bench/*.cpp
          docker pull -q gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          for v in c2 a ac cx; do
            docker run --rm --network=none -v "$PWD/bench:/src:ro" -v /tmp:/out gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce \
              g++ -O3 -std=c++17 -pthread -flto -static -s -o "/out/d-$v" "/src/$v.cpp"
          done
          docker run --rm --network=none -v "$PWD/bench:/src:ro" -v /tmp:/out gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce \
            g++ -O3 -std=c++17 -pthread -flto -static -s -march=x86-64-v3 -o /out/d-a3 /src/a.cpp
          nproc; lscpu | grep -E 'Model name|Thread|Core'
      - name: Differential and boundary regression of the candidates
        shell: bash
        run: |
          set -euo pipefail
          for v in a a3 ac; do
            SD_TEST_BINARY="/tmp/d-$v" python tests/test_d.py
            SD_TEST_BINARY="/tmp/d-$v" python tests/boundary_d.py
          done
          SD_TEST_BINARY=/tmp/d-a python tests/stress_d.py 20
          SD_TEST_BINARY=/tmp/d-ac python tests/stress_d.py 20
      - name: Organizer generator, full seeds 1 and 7
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          for seed in 1 7; do
            python /tmp/official/generators/d_traverse.py --seed "$seed" --scale full --out "/tmp/data-$seed"
          done
          echo 'fe6471f2712d10b23c2ec58a4cbc7db1ea3e742daf6b6db62829e74d6c4a26c7  /tmp/data-1/graph.txt' | sha256sum -c
          echo '160f1ef48378dcb567a8d9ddd2676ee777b044a5ede3ad4c7b42e812aa4b3a6f  /tmp/data-1/queries.txt' | sha256sum -c
      - name: Randomized paired exact full-seed benchmark
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, random, statistics, time
          from pathlib import Path
          names = ('c2', 'a', 'a3', 'ac', 'cx')
          rng = random.Random(20261102)
          want = {1: 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e',
                  7: '66d63e1c9c1f80583914b835d82fd24e1bd78fba3bdc1cf73efb7f60ed4fe646'}
          for seed in (1, 7):
              for workers in (4, 6, 12):
                  wall = {n: [] for n in names}; rss = {n: [] for n in names}
                  for r in range(11):
                      order = list(names); rng.shuffle(order)
                      for n in order:
                          out = Path(f'/tmp/out-{n}'); out.mkdir(exist_ok=True)
                          env = dict(os.environ, SD_DATA=f'/tmp/data-{seed}', SD_OUT=str(out), SD_THREADS=str(workers))
                          t0 = time.perf_counter()
                          pid = os.fork()
                          if pid == 0:
                              os.execve(f'/tmp/d-{n}', [f'/tmp/d-{n}'], env)
                          _, status, ru = os.wait4(pid, 0)
                          dt = time.perf_counter() - t0
                          assert os.waitstatus_to_exitcode(status) == 0, (n, seed, workers)
                          digest = hashlib.sha256((out / 'distances.txt').read_bytes()).hexdigest()
                          assert digest == want[seed], (n, seed, workers, r, digest)
                          wall[n].append(dt); rss[n].append(ru.ru_maxrss)
                  base = statistics.median(wall['c2'])
                  print(f'SEED={seed} WORKERS={workers} c2 median {base:.6f} s')
                  for n in names:
                      med = statistics.median(wall[n])
                      wins = sum(a < b for a, b in zip(wall[n], wall['c2']))
                      print(f'  {n:7s} median {med:.6f} s ({(med / base - 1) * 100:+.2f}% vs c2, {wins}/11 paired wins) '
                            f'min {min(wall[n]):.6f} max {max(wall[n]):.6f} maxrss {max(rss[n])} KiB', flush=True)
          print('ALL OUTPUTS EXACT')
          PY
