name: Track D claim strategy tournament
on:
  push:
    branches: ['d/chat-claim-tournament-20261102-02']
    paths: ['.github/workflows/d-chat-claim-tournament.yml']
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch three exact candidate commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            refs/heads/prize/d-codex-final-claim-atomic \
            refs/heads/prize/d-codex-final-claim-bytes \
            refs/heads/d/chat-byte-exchange-20261102-02
          mkdir -p /tmp/dclaim
          git show 888e22648c0821e5fcdc0963e99dd38be512e496:track-d/d_traverse.cpp > /tmp/dclaim/atomic.cpp
          git show 303ca2c85c95050d71656376cfc0b2fc17b818bb:track-d/d_traverse.cpp > /tmp/dclaim/bytes.cpp
          git show b57bd55a3ae69304f9781552c0042f899465be95:track-d/d_traverse.cpp > /tmp/dclaim/xchg.cpp
          git show 888e22648c0821e5fcdc0963e99dd38be512e496:tests/saturation_d.py > tests/saturation_d.py
          sha256sum /tmp/dclaim/*.cpp
      - name: Compile with official pinned GCC15 flags
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/dclaim:/work -w /work \
            gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce \
            bash -euc 'for v in atomic bytes xchg; do g++ -O3 -std=c++17 -pthread -flto -static -s -o "$v" "$v.cpp"; done'
          ls -lh /tmp/dclaim/{atomic,bytes,xchg}
      - name: Differential and wide-distance checks on new variant
        shell: bash
        env:
          SD_TEST_BINARY: /tmp/dclaim/xchg
        run: |
          set -euo pipefail
          python3 tests/test_d.py
          python3 tests/boundary_d.py
          python3 tests/saturation_d.py
          python3 tests/stress_d.py 30
      - name: Randomized exact full-seed paired timing
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          cat > /tmp/dclaim/compare.py <<'PY'
          import hashlib, os, random, statistics, subprocess, time
          from pathlib import Path
          variants = ['atomic', 'bytes', 'xchg']
          expected = 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e'
          for seed in (1, 7):
              data = Path(f'/tmp/dclaim/data-{seed}')
              data.mkdir(exist_ok=True)
              subprocess.run(['python3', '/tmp/official/generators/d_traverse.py',
                              '--scale', 'full', '--seed', str(seed), '--out', str(data)], check=True)
              for workers in (4, 6, 12):
                  times = {v: [] for v in variants}
                  rss = {v: [] for v in variants}
                  hashes = set()
                  out = Path('/tmp/dclaim/out')
                  out.mkdir(exist_ok=True)
                  env = dict(os.environ, SD_DATA=str(data), SD_OUT=str(out), SD_THREADS=str(workers))
                  for round_no in range(12):
                      order = variants[:]
                      random.Random(100000 * seed + 100 * workers + round_no).shuffle(order)
                      for v in order:
                          t0 = time.perf_counter()
                          proc = subprocess.Popen([str(Path('/tmp/dclaim') / v)], env=env)
                          pid, status, usage = os.wait4(proc.pid, 0)
                          proc.returncode = os.waitstatus_to_exitcode(status)
                          if proc.returncode:
                              raise RuntimeError(f'{v} seed={seed} workers={workers} exit={proc.returncode}')
                          elapsed = time.perf_counter() - t0
                          digest = hashlib.sha256((out / 'distances.txt').read_bytes()).hexdigest()
                          if seed == 1 and digest != expected:
                              raise RuntimeError(f'official seed-1 hash mismatch {v}: {digest}')
                          hashes.add(digest)
                          if round_no:
                              times[v].append(elapsed)
                              rss[v].append(usage.ru_maxrss)
                  if len(hashes) != 1:
                      raise RuntimeError(f'cross-variant output mismatch seed={seed} workers={workers}: {hashes}')
                  med = {v: statistics.median(times[v]) for v in variants}
                  mem = {v: statistics.median(rss[v]) for v in variants}
                  wins = {v: sum(a < b for a, b in zip(times[v], times['atomic'])) for v in variants[1:]}
                  print(f'PASS seed={seed} workers={workers} sha={next(iter(hashes))}', flush=True)
                  print(f'medians_seconds={med} medians_RSS_KiB={mem} paired_wins_vs_atomic={wins}', flush=True)
          PY
          python3 /tmp/dclaim/compare.py
