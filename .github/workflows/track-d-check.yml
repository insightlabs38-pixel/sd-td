name: Track D exactness and Docker
on:
  push:
    paths:
      - .github/workflows/track-d-check.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain public organizer oracle
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Build candidate
        run: g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/traverse track-d/d_traverse.cpp
      - name: Differential random and adversarial cases
        run: SD_TEST_BINARY=/tmp/traverse python tests/test_d.py
      - name: Compare official generated cases
        shell: bash
        run: |
          set -euo pipefail
          for item in 'tiny 2' 'sample 1' 'sample 2'; do
            read -r scale seed <<< "$item"
            mkdir -p "/tmp/data-$scale-$seed" "/tmp/ref-$scale-$seed" "/tmp/out-$scale-$seed"
            python /tmp/official/generators/d_traverse.py --seed "$seed" --scale "$scale" --out "/tmp/data-$scale-$seed"
            python /tmp/official/reference/d_traverse.py --data "/tmp/data-$scale-$seed" --out "/tmp/ref-$scale-$seed"
            SD_DATA="/tmp/data-$scale-$seed" SD_OUT="/tmp/out-$scale-$seed" /tmp/traverse
            cmp "/tmp/ref-$scale-$seed/distances.txt" "/tmp/out-$scale-$seed/distances.txt"
            sha256sum "/tmp/out-$scale-$seed/distances.txt"
          done
          echo 'a4c76ed030bc7e365db33191f6cf74708fba7f25eb48d64c8c4279f2e57046a0  /tmp/out-sample-1/distances.txt' | sha256sum -c
      - name: Full seed-1 official hashes and native resource use
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-data /tmp/full-out
          python /tmp/official/generators/d_traverse.py --seed 1 --scale full --out /tmp/full-data
          echo 'fe6471f2712d10b23c2ec58a4cbc7db1ea3e742daf6b6db62829e74d6c4a26c7  /tmp/full-data/graph.txt' | sha256sum -c
          echo '160f1ef48378dcb567a8d9ddd2676ee777b044a5ede3ad4c7b42e812aa4b3a6f  /tmp/full-data/queries.txt' | sha256sum -c
          SD_DATA=/tmp/full-data SD_OUT=/tmp/full-out /usr/bin/time -v /tmp/traverse
          echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/full-out/distances.txt' | sha256sum -c
      - name: Build official-style pinned Docker image
        run: docker build --pull -t sd-td-check track-d
      - name: Docker runtime and output byte comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-out
          docker run --rm --network none --read-only -e TRACK=d -v /tmp/data-sample-1:/data:ro -v /tmp/docker-out:/out:rw sd-td-check
          cmp /tmp/ref-sample-1/distances.txt /tmp/docker-out/distances.txt
          mkdir -p /tmp/docker-full-out
          docker run --rm --network none --read-only --memory 8g -e TRACK=d -v /tmp/full-data:/data:ro -v /tmp/docker-full-out:/out:rw sd-td-check
          cmp /tmp/full-out/distances.txt /tmp/docker-full-out/distances.txt
      - name: Docker worker-count matrix
        shell: bash
        run: |
          set -euo pipefail
          for t in 1 4 12; do
            mkdir -p "/tmp/docker-t$t"
            docker run --rm --network none --read-only --memory 8g -e TRACK=d -e SD_THREADS=$t -v /tmp/full-data:/data:ro -v "/tmp/docker-t$t:/out:rw" sd-td-check
            cmp /tmp/full-out/distances.txt "/tmp/docker-t$t/distances.txt"
          done

      - name: Adjacency-order exactness and matched tournament
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show FETCH_HEAD:track-d/d_traverse.cpp > /tmp/d_baseline.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d_baseline /tmp/d_baseline.cpp
          for variant in 00 10 01 11; do
            g++ -O3 -std=c++17 -pthread -flto -static -s \
              -DSD_FWD_REVERSE=${variant:0:1} -DSD_REV_REVERSE=${variant:1:1} \
              -o "/tmp/d_$variant" track-d/d_traverse.cpp
          done
          for variant in 10 01 11; do
            SD_TEST_BINARY="/tmp/d_$variant" python tests/test_d.py
          done
          python - <<'PY'
          import hashlib
          import os
          import random
          import statistics
          import subprocess
          import time
          expected = 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e'
          variants = ['base', '00', '10', '01', '11']
          paths = {v: ('/tmp/d_baseline' if v == 'base' else '/tmp/d_' + v) for v in variants}
          for workers in (4, 6, 12):
              records = {v: [] for v in variants}
              for rnd in range(13):
                  order = variants.copy()
                  random.Random(20261031 + rnd * 31 + workers).shuffle(order)
                  for variant in order:
                      env = dict(os.environ, SD_DATA='/tmp/full-data', SD_OUT='/tmp/full-out', SD_THREADS=str(workers))
                      start = time.perf_counter()
                      proc = subprocess.run(['/usr/bin/time', '-f', '%U %M', '-o', '/tmp/d_time.txt', paths[variant]],
                                            env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      elapsed = time.perf_counter() - start
                      if proc.returncode:
                          raise RuntimeError((variant, workers, proc.stderr.decode()[-2000:]))
                      with open('/tmp/full-out/distances.txt', 'rb') as f:
                          digest = hashlib.sha256(f.read()).hexdigest()
                      if digest != expected:
                          raise RuntimeError(('OUTPUT MISMATCH', variant, workers, rnd, digest))
                      cpu, rss = open('/tmp/d_time.txt').read().split()
                      records[variant].append((elapsed, float(cpu), int(rss)))
              for variant in variants:
                  vals = records[variant]
                  wins = sum(vals[i][0] < records['base'][i][0] for i in range(13)) if variant != 'base' else 0
                  print('RESULT workers=%d variant=%s wall=%.6f user=%.4f rss_kib=%d wins_vs_base=%d/13' %
                        (workers, variant, statistics.median(x[0] for x in vals),
                         statistics.median(x[1] for x in vals), statistics.median(x[2] for x in vals), wins), flush=True)
          PY
