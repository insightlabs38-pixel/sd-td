name: D partial hierarchy pinned offline PGO Docker qualification
on:
  push:
    branches: ['research/d-breakthrough-20261101-partial-ch']
    paths: ['research/docker-partial-ch/**','.github/workflows/d-partial-pgo-docker.yml']
  workflow_dispatch:
jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Build baseline and independent variant with identical pinned PGO environment
        run: |
          docker build --pull -t sd-d-base-pgo track-d
          docker build --pull -f research/docker-partial-ch/Dockerfile -t sd-d-pch-pgo .
      - name: Official full seed1 Docker exactness and 4-worker comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-data /tmp/out-base /tmp/out-pch
          python /tmp/official/generators/d_traverse.py --seed 1 --scale full --out /tmp/full-data
          for pair in 'base sd-d-base-pgo /tmp/out-base' 'pch sd-d-pch-pgo /tmp/out-pch'; do
            read -r mode image out <<< "$pair"
            for rep in 1 2 3 4 5; do
              echo "D_PINNED_DOCKER mode=$mode rep=$rep"
              /usr/bin/time -f 'D_PINNED_DOCKER wall_s=%e' docker run --rm --network none --read-only --memory 8g -e SD_THREADS=4 -e TRACK=d -v /tmp/full-data:/data:ro -v "$out:/out:rw" "$image"
              echo "a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  $out/distances.txt" | sha256sum -c
            done
          done
