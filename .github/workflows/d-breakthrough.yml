name: D architectural breakthrough research
on:
  push:
    branches:
      - 'research/d-breakthrough-20261101*'
    paths:
      - 'research/d-breakthrough/**'
      - '.github/workflows/d-breakthrough.yml'
  workflow_dispatch:

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch public frozen organizer oracle
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Build baseline and three exact lazy-contraction engines
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/d-base track-d/d_traverse.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_LAZY_DEG=3 -DSD_LAZY_DEPTH=1 -o /tmp/d-lazy31 research/d-breakthrough/lazy_virtual_shortcuts.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_LAZY_DEG=3 -DSD_LAZY_DEPTH=3 -o /tmp/d-lazy33 research/d-breakthrough/lazy_virtual_shortcuts.cpp
          g++ -O3 -std=c++17 -pthread -flto -static -s -DSD_LAZY_DEG=4 -DSD_LAZY_DEPTH=2 -o /tmp/d-lazy42 research/d-breakthrough/lazy_virtual_shortcuts.cpp
          wc -c track-d/d_traverse.cpp research/d-breakthrough/lazy_virtual_shortcuts.cpp
      - name: Independent adversarial Dijkstra differential (each architecture)
        run: |
          set -euo pipefail
          for mode in lazy31 lazy33 lazy42; do
            echo "EXACTNESS $mode"
            SD_TEST_BINARY=/tmp/d-$mode python tests/test_d.py
          done
      - name: Full generator seeds, complete 2000-query batches, paired times
        run: python research/d-breakthrough/bench_full.py
      - name: Native sanitizer build and differential
        run: |
          set -euo pipefail
          g++ -O1 -g -std=c++17 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -DSD_LAZY_DEG=3 -DSD_LAZY_DEPTH=3 -o /tmp/d-san research/d-breakthrough/lazy_virtual_shortcuts.cpp
          SD_TEST_BINARY=/tmp/d-san python tests/test_d.py
      - name: Artifact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-lazy-shortcut-full-tournament
          path: /tmp/d-bt-results.json
          if-no-files-found: ignore
