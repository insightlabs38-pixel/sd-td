name: Track D worker-local claim cache tournament
on:
  push:
    branches: ['d/chat-local-claim-cache-20261102']
    paths: ['track-d/d_traverse.cpp', '.github/workflows/d-chat-claim-cache.yml']
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build pinned GCC15 baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/claim
          git show 2a9a2e52405ab67448173b1788bc64a5cdb7ae51:track-d/d_traverse.cpp > /tmp/claim/base.cpp
          cp track-d/d_traverse.cpp /tmp/claim/new.cpp
          docker run --rm -v /tmp/claim:/work -w /work gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce sh -c '
            g++ -O3 -std=c++17 -pthread -flto -static -s -o /work/base /work/base.cpp
            g++ -O3 -std=c++17 -pthread -flto -static -s -o /work/new /work/new.cpp'
          sha256sum /tmp/claim/base /tmp/claim/new
      - name: Differential and adversarial correctness
        shell: bash
        run: |
          set -euo pipefail
          export SD_TEST_BINARY=/tmp/claim/new
          python tests/test_d.py
          python tests/boundary_d.py
          python tests/saturation_d.py
          python tests/stress_d.py 20
          python tests/claim_schedule_d.py
      - name: Generate official full seeds and compare exact outputs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          for seed in 1 7; do
            mkdir -p /tmp/claim/data-$seed /tmp/claim/base-out-$seed /tmp/claim/new-out-$seed
            python /tmp/official/generators/d_traverse.py --seed "$seed" --scale full --out "/tmp/claim/data-$seed"
            for bin in base new; do
              SD_THREADS=6 SD_DATA="/tmp/claim/data-$seed" SD_OUT="/tmp/claim/$bin-out-$seed" "/tmp/claim/$bin"
            done
            cmp "/tmp/claim/base-out-$seed/distances.txt" "/tmp/claim/new-out-$seed/distances.txt"
          done
          echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/claim/new-out-1/distances.txt' | sha256sum -c
      - name: Randomized paired full-seed tournament
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, random, statistics, subprocess, time
          root=pathlib.Path('/tmp/claim')
          rng=random.Random(202611020137)
          for seed in (1,7):
              for workers in (4,6,12):
                  samples={'base':[],'new':[]}
                  wins=0
                  for round in range(11):
                      order=['base','new']
                      rng.shuffle(order)
                      pair={}
                      for name in order:
                          env=os.environ.copy()
                          env.update(SD_THREADS=str(workers),SD_DATA=str(root/f'data-{seed}'),SD_OUT=str(root/f'{name}-out-{seed}'))
                          t=time.perf_counter_ns()
                          subprocess.run([str(root/name)],env=env,check=True,stdout=subprocess.DEVNULL)
                          pair[name]=(time.perf_counter_ns()-t)/1e9
                          assert (root/f'{name}-out-{seed}'/'distances.txt').read_bytes()==(root/f'base-out-{seed}'/'distances.txt').read_bytes()
                      for name in pair: samples[name].append(pair[name])
                      wins+=pair['new']<pair['base']
                  a=statistics.median(samples['base']);b=statistics.median(samples['new'])
                  print(f'seed={seed} workers={workers} base={a:.6f}s new={b:.6f}s delta={(b/a-1)*100:+.2f}% paired_wins={wins}/11',flush=True)
          PY
