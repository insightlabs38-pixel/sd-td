name: D construction worker cap tournament
on:
  push:
    paths:
      - .github/workflows/track-d-check.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build five isolated construction variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('track-d/d_traverse.cpp').read_text()
          needle='std::min(threads, 4u)'
          assert src.count(needle)==1
          for cap in (2,3,4,5,6):
              Path(f'/tmp/d-cap{cap}.cpp').write_text(src.replace(needle,f'std::min(threads, {cap}u)'))
          PY
          for cap in 2 3 4 5 6; do
            g++ -O3 -std=c++17 -pthread -flto -static -s -o "/tmp/d-cap$cap" "/tmp/d-cap$cap.cpp"
          done
      - name: Differential and adversarial regression on extreme caps
        shell: bash
        run: |
          set -euo pipefail
          for cap in 2 6; do
            SD_TEST_BINARY="/tmp/d-cap$cap" python tests/test_d.py
          done
      - name: Obtain organizer generator and generate matched full seeds
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
          for seed in 1 7; do
            python /tmp/official/generators/d_traverse.py --seed "$seed" --scale full --out "/tmp/data-$seed"
          done
          echo 'fe6471f2712d10b23c2ec58a4cbc7db1ea3e742daf6b6db62829e74d6c4a26c7  /tmp/data-1/graph.txt' | sha256sum -c
          echo '160f1ef48378dcb567a8d9ddd2676ee777b044a5ede3ad4c7b42e812aa4b3a6f  /tmp/data-1/queries.txt' | sha256sum -c
      - name: Randomized paired exact full-seed tournament
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, random, statistics, subprocess, time
          from pathlib import Path
          caps=(2,3,4,5,6)
          rng=random.Random(2026110122)
          expected1='a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e'
          for seed in (1,7):
              for workers in (4,6,12):
                  times={c:[] for c in caps}
                  expected=expected1 if seed==1 else None
                  for round_id in range(9):
                      order=list(caps); rng.shuffle(order)
                      for cap in order:
                          out=Path(f'/tmp/out-{seed}-{workers}-{cap}')
                          out.mkdir(exist_ok=True)
                          env=os.environ.copy()
                          env.update(SD_DATA=f'/tmp/data-{seed}',SD_OUT=str(out),SD_THREADS=str(workers))
                          t0=time.perf_counter()
                          subprocess.run([f'/tmp/d-cap{cap}'],env=env,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                          elapsed=time.perf_counter()-t0
                          digest=hashlib.sha256((out/'distances.txt').read_bytes()).hexdigest()
                          if expected is None: expected=digest
                          assert digest==expected,(seed,workers,cap,round_id,digest,expected)
                          times[cap].append(elapsed)
                  base=statistics.median(times[4])
                  print(f'SEED={seed} WORKERS={workers} BASE4={base:.6f} sec')
                  for cap in caps:
                      med=statistics.median(times[cap])
                      wins=sum(a<b for a,b in zip(times[cap],times[4])) if cap!=4 else 0
                      print(f'CAP={cap} median={med:.6f} change_pct={(med/base-1)*100:+.3f} wins={wins}/9')
                  print('EXACT_SHA',expected,flush=True)
          PY
