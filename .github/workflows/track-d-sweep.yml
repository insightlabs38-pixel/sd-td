name: Track D thread and probe sweep
on:
  push:
    paths:
      - .github/workflows/track-d-sweep.yml

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain public organizer generator
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Build and generate full seed 1
        shell: bash
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -pthread -flto -static -s -o /tmp/traverse track-d/d_traverse.cpp
          mkdir -p /tmp/full-data /tmp/full-out
          python /tmp/official/generators/d_traverse.py --seed 1 --scale full --out /tmp/full-data
          echo 'fe6471f2712d10b23c2ec58a4cbc7db1ea3e742daf6b6db62829e74d6c4a26c7  /tmp/full-data/graph.txt' | sha256sum -c
          echo '160f1ef48378dcb567a8d9ddd2676ee777b044a5ede3ad4c7b42e812aa4b3a6f  /tmp/full-data/queries.txt' | sha256sum -c
      - name: Three-pass full-run thread and probe tournament
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            for threads in 1 2 3 4 6 8 12; do
              SD_THREADS="$threads" SD_PROBE=256 SD_DATA=/tmp/full-data SD_OUT=/tmp/full-out /usr/bin/time -f "D_SWEEP $pass threads=$threads probe=256 elapsed=%e rss_kib=%M user=%U" /tmp/traverse
              echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/full-out/distances.txt' | sha256sum -c
            done
            for threads in 4 6 12; do
              for probe in 64 128 512; do
                SD_THREADS="$threads" SD_PROBE="$probe" SD_DATA=/tmp/full-data SD_OUT=/tmp/full-out /usr/bin/time -f "D_SWEEP $pass threads=$threads probe=$probe elapsed=%e rss_kib=%M user=%U" /tmp/traverse
                echo 'a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e  /tmp/full-out/distances.txt' | sha256sum -c
              done
            done
          done
