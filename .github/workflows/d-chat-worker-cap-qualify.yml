name: Track D query-worker cap tournament
on:
  push:
    branches: ['d/chat-worker-cap-tournament-20261102-10']
    paths: ['.github/workflows/d-chat-worker-cap-qualify.yml']
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build immutable qualified candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/cap
          git fetch --no-tags origin prize/d-codex-final-prefix-eight prize/d-codex-final-prefix-twelve
          git cat-file blob 24aff529703cb9aca78976b70682edcfd97ce6f0 > /tmp/cap/six.cpp
          git cat-file blob a599c41c945028da700ddfd405a6c0214ed07502 > /tmp/cap/eight.cpp
          git cat-file blob 5d56a5bebdf1d82633e6e643801213f5df987578 > /tmp/cap/twelve.cpp
          docker run --rm -v /tmp/cap:/work -w /work gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce bash -c 'set -e; for x in six eight twelve; do g++ -O3 -std=c++17 -pthread -flto -static -s -o $x $x.cpp; done'
          sha256sum /tmp/cap/six /tmp/cap/eight /tmp/cap/twelve
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/official
      - name: Exact paired full-seed tournament
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,random,statistics,subprocess,time
          from collections import defaultdict
          expected={1:"a23dbdf0a3e49cc8901310a9ee1dc6a9a569a85297b6da75c2a7002cb2ed277e",7:"66d63e1c9c1f80583914b835d82fd24e1bd78fba3bdc1cf73efb7f60ed4fe646",17:"ad7c211024014a4c21a50faab598dd19e730cbc0b4e8013a7d3b3306132913ba"}
          names=["six","eight","twelve"]
          data={}
          for seed in expected:
              folder=f"/tmp/cap-data-{seed}"
              subprocess.run(["python","/tmp/official/generators/d_traverse.py","--scale","full","--seed",str(seed),"--out",folder],check=True)
              data[seed]=folder
              print("GENERATED",seed,flush=True)
          out="/tmp/cap-out";os.makedirs(out,exist_ok=True)
          results=defaultdict(list)
          for seed in expected:
              for workers in (6,12):
                  env=os.environ.copy();env.update(SD_DATA=data[seed],SD_OUT=out,SD_THREADS=str(workers))
                  for rnd in range(14):
                      order=names[:];random.Random(15000*seed+100*workers+rnd).shuffle(order)
                      for name in order:
                          start=time.perf_counter()
                          subprocess.run(["/tmp/cap/"+name],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,check=True,timeout=30)
                          elapsed=time.perf_counter()-start
                          with open(out+"/distances.txt","rb") as f:sha=hashlib.sha256(f.read()).hexdigest()
                          if sha!=expected[seed]:raise RuntimeError(f"mismatch {seed} {workers} {name} {sha}")
                          if rnd:results[(seed,workers,name)].append(elapsed)
                  base=statistics.median(results[(seed,workers,"six")])
                  for name in names:
                      v=results[(seed,workers,name)];med=statistics.median(v)
                      print(f"RESULT seed={seed} workers={workers} name={name} median={med:.6f}s ratio={base/med:.5f} runs={len(v)}",flush=True)
          print("ALL EXACT: 234 measured full-seed executions plus 18 warmups",flush=True)
          PY
